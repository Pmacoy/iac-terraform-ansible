name: Ansible

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible:
    name: lint, apply, idempotence, functional verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install --quiet ansible-core==2.17.6 ansible-lint==24.12.2

      - name: ansible-lint
        run: ansible-lint ansible/playbooks/site.yml

      - name: Generate the demo fleet's SSH keypair
        run: bash scripts/generate-ssh-key.sh

      - name: Build and start the fleet containers
        run: docker compose up -d --build corporate-server-1 corporate-server-2

      - name: Wait for SSH on both fleet nodes
        run: bash scripts/wait-for-ssh.sh

      # This is the real thing, not a --check/--diff dry run: it connects
      # over real SSH to two real (containerized) hosts and configures
      # them for real -- installs packages, hardens sshd, deploys nginx.
      - name: Run the site playbook
        run: ansible-playbook ansible/playbooks/site.yml

      - name: Verify idempotence (second run must report no changes)
        run: bash scripts/verify-idempotence.sh

      - name: Verify the fleet is actually configured and reachable
        run: bash scripts/verify-functional.sh

      - name: Dump container state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Tear down the fleet containers
        if: always()
        run: docker compose down -v
