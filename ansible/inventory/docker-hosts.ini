# The two corporate-server-* containers from docker-compose.yml, reachable
# on localhost via the ports it publishes. In a real deployment this file
# would instead be populated from Terraform's own output (e.g. via the
# aws_ec2 dynamic inventory plugin against the fleet Terraform provisions)
# -- fixed here only because the "instances" are local Docker containers,
# not because the pattern changes.
[fleet]
corporate-server-1 ansible_host=127.0.0.1 ansible_port=2201
corporate-server-2 ansible_host=127.0.0.1 ansible_port=2202

[fleet:vars]
ansible_user=bootstrap
ansible_python_interpreter=/usr/bin/python3
