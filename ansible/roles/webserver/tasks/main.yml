---
- name: Install nginx
  # See baseline/tasks/main.yml for why cache_valid_time matters here too
  # (idempotence on Ubuntu, and only safe because the Dockerfile keeps
  # /var/lib/apt/lists/* around).
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the demo index page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Reload nginx

- name: Ensure nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
