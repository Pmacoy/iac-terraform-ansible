---
- name: Install nginx
  # See baseline/tasks/main.yml for why there's no cache_valid_time here.
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy the demo index page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Reload nginx

- name: Ensure nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
