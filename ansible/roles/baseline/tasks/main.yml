---
- name: Update apt package cache
  # cache_valid_time matters for two different reasons here, not just
  # speed:
  #  - Without it, Ansible's apt module runs a real `apt-get update` on
  #    every single play, and Ubuntu's index (unlike Debian's) doesn't
  #    report changed=false reliably when nothing actually changed --
  #    verify-idempotence.sh caught this for real: the second run of the
  #    playbook reported changed=1 on this exact task. See
  #    https://github.com/ansible/ansible/issues/73307 and
  #    https://github.com/ansible/ansible/issues/76819.
  #  - It only works because docker/corporate-server/Dockerfile no longer
  #    deletes /var/lib/apt/lists/* after its own apt-get install -- an
  #    earlier version of this repo did, which left cache_valid_time
  #    trusting a cache that looked fresh but was actually empty, and
  #    every apt-get install below failed with "No package matching
  #    '<pkg>' is available". See the comment on that Dockerfile RUN.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present

- name: Set a message-of-the-day banner
  ansible.builtin.copy:
    dest: /etc/motd
    content: "{{ baseline_motd }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure the deploy group exists
  ansible.builtin.group:
    name: "{{ baseline_deploy_group }}"
    state: present

- name: Ensure a deploy user exists for application deployments
  ansible.builtin.user:
    name: "{{ baseline_deploy_user }}"
    group: "{{ baseline_deploy_group }}"
    shell: /bin/bash
    create_home: true
    state: present
