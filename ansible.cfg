[defaults]
inventory      = ansible/inventory/docker-hosts.ini
roles_path     = ansible/roles
# The fleet containers are recreated on every CI run (fresh host keys each
# time -- see entrypoint.sh), so a known_hosts file would just accumulate
# stale entries and start failing connections. There's nothing here that
# host-key pinning would protect anyway; this is a disposable demo fleet.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
nocows = 1
ansible_managed = Managed by Ansible -- local changes will be overwritten. See iac-terraform-ansible on GitHub.

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
# Generated by scripts/generate-ssh-key.sh; matches docker-compose.yml's
# BOOTSTRAP_SSH_PUBKEY and the inventory's ansible_user.
ssh_args = -o UserKnownHostsFile=/dev/null -i .ssh/demo_key
